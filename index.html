<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#090711">
	<title>Exposición de Arte</title>
	<style>
		:root {
			color-scheme: dark;
			background: #090711;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			background:
				radial-gradient(ellipse at 50% 49%, rgba(80, 52, 118, 0.21), transparent 58%),
				radial-gradient(ellipse at 15% 78%, rgba(71, 39, 107, 0.16), transparent 48%),
				#090711;
		}

		.stage {
			position: relative;
			width: 100%;
			height: 100vh;
			height: 100svh;
			min-height: 100%;
			overflow: hidden;
			isolation: isolate;
			touch-action: none;
		}

		.stage::after {
			position: absolute;
			z-index: 1;
			inset: 0;
			background:
				radial-gradient(ellipse at center, transparent 22%, rgba(6, 4, 12, 0.24) 100%),
				linear-gradient(180deg, rgba(7, 5, 12, 0.18), transparent 28%, transparent 76%, rgba(7, 5, 12, 0.24));
			content: "";
			pointer-events: none;
		}

		#shards {
			position: absolute;
			inset: 0;
			display: block;
			width: 100%;
			height: 100%;
		}

		@media (prefers-reduced-motion: reduce) {
			.stage {
				touch-action: manipulation;
			}
		}
	</style>
</head>
<body>
	<main class="stage" aria-hidden="true">
		<canvas id="shards"></canvas>
	</main>
	<script>
		(() => {
			const canvas = document.getElementById("shards");
			const context = canvas.getContext("2d");
			if (!context) return;

			const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
			const pointer = { x: -1000, y: -1000, active: false, down: false };
			const pulses = [];
			const markerPositions = [
				[0.12, 0.18],
				[0.29, 0.48],
				[0.61, 0.4],
				[0.82, 0.22],
				[0.91, 0.7],
				[0.17, 0.76],
				[0.54, 0.86]
			];
			let width = 0;
			let height = 0;
			let pixelRatio = 1;
			let shards = [];
			let frameId = 0;
			let lastFrame = 0;

			const random = (min, max) => min + Math.random() * (max - min);
			const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

			function shardCount() {
				let count = Math.min(1300, Math.max(260, Math.round(width * height / 850)));
				const memory = navigator.deviceMemory || 8;
				const cores = navigator.hardwareConcurrency || 8;

				if (memory <= 4 || cores <= 4) count = Math.round(count * 0.72);
				if (width < 600) count = Math.min(count, 480);
				return count;
			}

			function createShards() {
				const count = shardCount();
				const weights = [0.26, 0.23, 0.2, 0.17, 0.14];

				shards = Array.from({ length: count }, () => {
					const pick = Math.random();
					let cumulative = 0;
					let layer = weights.length - 1;
					for (let index = 0; index < weights.length; index++) {
						cumulative += weights[index];
						if (pick < cumulative) {
							layer = index;
							break;
						}
					}

					const depth = layer / (weights.length - 1);
					const x = random(-16, width + 16);
					const ambient = Math.random() < 0.14;
					const wave = 0.51
						+ Math.sin((x / Math.max(width, 1)) * Math.PI * 2.2 + layer * 0.72) * 0.2
						+ (layer - 2) * 0.018;
					const y = ambient
						? random(0, height)
						: height * wave + random(-height * 0.075, height * 0.075);
					const size = random(3, 13) * (1.45 - depth * 0.62);
					const widthScale = random(0.7, 1.8);
					const heightScale = random(0.36, 0.82);

					return {
						x,
						y,
						size,
						widthScale,
						heightScale,
						angle: random(0, Math.PI * 2),
						spin: random(-0.2, 0.2),
						driftX: random(-5, 5) * (1 - depth * 0.45),
						driftY: random(-3, 3) * (1 - depth * 0.45),
						depth,
						alpha: random(0.18, 0.56) * (1 - depth * 0.38),
						tint: Math.random() > 0.72 ? "168, 85, 247" : "137, 106, 189"
					};
				}).sort((a, b) => b.depth - a.depth);
			}

			function resize() {
				const bounds = canvas.getBoundingClientRect();
				width = bounds.width;
				height = bounds.height;
				const smallScreen = width < 600;
				pixelRatio = Math.min(window.devicePixelRatio || 1, smallScreen ? 1.5 : 2);
				canvas.width = Math.round(width * pixelRatio);
				canvas.height = Math.round(height * pixelRatio);
				context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
				createShards();
				if (reducedMotion.matches) draw(0, 0);
			}

			function drawShard(shard, elapsed) {
				const size = shard.size;
				let x = shard.x + Math.sin(elapsed * 0.00022 + shard.angle) * 7 * (1 - shard.depth * 0.5);
				let y = shard.y + Math.cos(elapsed * 0.00018 + shard.angle) * 8 * (1 - shard.depth * 0.5);

				if (pointer.active) {
					const dx = x - pointer.x;
					const dy = y - pointer.y;
					const distance = Math.hypot(dx, dy);
					const reach = pointer.down ? 190 : 135;
					if (distance < reach && distance > 0) {
						const force = (1 - distance / reach) * (pointer.down ? -30 : 24);
						x += (dx / distance) * force;
						y += (dy / distance) * force;
					}
				}

				const halfWidth = size * shard.widthScale;
				const halfHeight = size * shard.heightScale;
				context.save();
				context.translate(x, y);
				context.rotate(shard.angle + elapsed * shard.spin * 0.00008);
				context.globalAlpha = shard.alpha;

				const glass = context.createLinearGradient(-halfWidth, -halfHeight, halfWidth, halfHeight);
				glass.addColorStop(0, `rgba(${shard.tint}, 0.76)`);
				glass.addColorStop(0.48, "rgba(91, 61, 133, 0.22)");
				glass.addColorStop(1, "rgba(29, 19, 44, 0.1)");

				context.beginPath();
				context.moveTo(-halfWidth * 0.76, -halfHeight * 0.1);
				context.lineTo(halfWidth * 0.18, -halfHeight * 0.78);
				context.lineTo(halfWidth * 0.84, -halfHeight * 0.02);
				context.lineTo(halfWidth * 0.12, halfHeight * 0.72);
				context.lineTo(-halfWidth * 0.44, halfHeight * 0.34);
				context.closePath();
				context.fillStyle = glass;
				context.fill();
				context.strokeStyle = "rgba(231, 216, 255, 0.56)";
				context.lineWidth = Math.max(0.45, 0.8 - shard.depth * 0.25);
				context.stroke();

				context.beginPath();
				context.moveTo(-halfWidth * 0.76, -halfHeight * 0.1);
				context.lineTo(halfWidth * 0.18, -halfHeight * 0.78);
				context.lineTo(halfWidth * 0.12, halfHeight * 0.72);
				context.closePath();
				context.fillStyle = "rgba(221, 202, 255, 0.14)";
				context.fill();
				context.restore();
			}

			function drawMarkers(elapsed) {
				const opacity = 0.18 + Math.sin(elapsed * 0.001) * 0.055;
				context.save();
				context.strokeStyle = `rgba(218, 196, 246, ${opacity})`;
				context.lineWidth = 1;
				for (const [x, y] of markerPositions) {
					const markerX = width * x;
					const markerY = height * y;
					context.beginPath();
					context.moveTo(markerX - 4, markerY);
					context.lineTo(markerX + 4, markerY);
					context.moveTo(markerX, markerY - 4);
					context.lineTo(markerX, markerY + 4);
					context.stroke();
				}
				context.restore();
			}

			function drawPulses(elapsed) {
				for (let index = pulses.length - 1; index >= 0; index--) {
					const pulse = pulses[index];
					const progress = (elapsed - pulse.startedAt) / 1500;
					if (progress >= 1) {
						pulses.splice(index, 1);
						continue;
					}
					const radius = progress * Math.min(width, height) * 0.42;
					context.beginPath();
					context.arc(pulse.x, pulse.y, Math.max(0, radius), 0, Math.PI * 2);
					context.strokeStyle = `rgba(194, 151, 238, ${(1 - progress) * 0.38})`;
					context.lineWidth = 1.2;
					context.stroke();
				}
			}

			function draw(elapsed, delta) {
				context.clearRect(0, 0, width, height);
				for (const shard of shards) {
					shard.x += shard.driftX * delta;
					shard.y += shard.driftY * delta;
					if (shard.x < -24) shard.x = width + 24;
					if (shard.x > width + 24) shard.x = -24;
					if (shard.y < -24) shard.y = height + 24;
					if (shard.y > height + 24) shard.y = -24;
					drawShard(shard, elapsed);
				}
				drawMarkers(elapsed);
				drawPulses(elapsed);
			}

			function animate(timestamp) {
				if (document.hidden || reducedMotion.matches) return;
				const delta = Math.min((timestamp - (lastFrame || timestamp)) / 1000, 0.04);
				lastFrame = timestamp;
				draw(timestamp, delta);
				frameId = window.requestAnimationFrame(animate);
			}

			function startAnimation() {
				window.cancelAnimationFrame(frameId);
				lastFrame = 0;
				if (reducedMotion.matches) {
					draw(0, 0);
					return;
				}
				if (!document.hidden) frameId = window.requestAnimationFrame(animate);
			}

			window.addEventListener("resize", resize, { passive: true });
			window.addEventListener("pointermove", event => {
				pointer.x = event.clientX;
				pointer.y = event.clientY;
				pointer.active = true;
			}, { passive: true });
			window.addEventListener("pointerleave", () => {
				pointer.active = false;
				pointer.down = false;
			});
			window.addEventListener("pointerdown", event => {
				pointer.x = event.clientX;
				pointer.y = event.clientY;
				pointer.active = true;
				pointer.down = true;
				pulses.push({ x: pointer.x, y: pointer.y, startedAt: performance.now() });
			}, { passive: true });
			window.addEventListener("pointerup", () => { pointer.down = false; });
			window.addEventListener("pointercancel", () => { pointer.down = false; });
			document.addEventListener("visibilitychange", startAnimation);
			if (reducedMotion.addEventListener) {
				reducedMotion.addEventListener("change", startAnimation);
			} else {
				reducedMotion.addListener(startAnimation);
			}

			resize();
			startAnimation();
		})();
	</script>
</body>
</html>
