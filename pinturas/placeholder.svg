<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
	<title id="title">Imagen de pintura pendiente</title>
	<desc id="description">Marcador provisional hasta añadir la pintura.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#161020"/>
			<stop offset="1" stop-color="#090711"/>
		</linearGradient>
		<radialGradient id="glow">
			<stop offset="0" stop-color="#ff9ffc" stop-opacity=".75"/>
			<stop offset="1" stop-color="#5227ff" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<rect width="1200" height="800" fill="url(#background)"/>
	<ellipse cx="360" cy="390" rx="440" ry="300" fill="url(#glow)" opacity=".8"/>
	<ellipse cx="900" cy="510" rx="380" ry="280" fill="url(#glow)" opacity=".5"/>
	<path d="M0 620C240 490 350 700 570 530s420-90 630-250v520H0z" fill="#b497cf" opacity=".14"/>
	<path d="M0 700c210-120 420-20 620-120s420-40 580-160v380H0z" fill="#ff9ffc" opacity=".1"/>
	<text x="600" y="400" fill="#f7f1fb" fill-opacity=".72" font-family="sans-serif" font-size="32" letter-spacing="9" text-anchor="middle">IMAGEN PENDIENTE</text>
</svg>
